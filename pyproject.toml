[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-virtual"
version = "0.7.0"
description = "Modular Windows desktop mouse automation tool"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouse_virtual = ["resources/*.qss", "resources/cursors/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
