[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-virtual"
version = "0.7.0"
description = "Modular Windows desktop mouse automation tool"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]
browser = ["playwright>=1.50,<2"]
existing-tab = ["websockets>=14,<17"]
desktop = ["pywinauto>=0.6.9,<0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouse_virtual = ["resources/*.qss", "resources/cursors/*.svg",
                 "infrastructure/browser/existing_tab_extension/*.js",
                 "infrastructure/browser/existing_tab_extension/*.json",
                 "infrastructure/browser/existing_tab_extension/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
